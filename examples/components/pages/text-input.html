<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){if(localStorage.getItem("aeico-demo-theme")==="dark")document.documentElement.setAttribute("theme","dark")})()</script>
  <title>TextInput - Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <div class="content">
    <div class="section">
      <h2>TextInput</h2>
      <span class="tag">&lt;ae-text-input&gt;</span>
      <div class="demo-group">
        <label>With resettable, default value: Hello</label>
        <ae-text-input placeholder="Type something..." resettable value="Hello" default-value="Hello"></ae-text-input>
        <label>With clearable</label>
        <ae-text-input placeholder="Clearable input" clearable value="Hello"></ae-text-input>

        <label>With resettable and clearable, default value: Hello, Action Button Style: Integrated(default)</label>
        <ae-text-input placeholder="Resettable and clearable input" resettable clearable value="Hello" default-value="Hello"></ae-text-input>

         <label>With resettable and clearable, default value: Hello, Action Button Style: Integrated(default)</label>
        <ae-text-input 
          placeholder="Resettable and clearable input" 
          resettable clearable value="Hello" 
          default-value="Hello"
          clear-text="Clear"
        >
        </ae-text-input>

        <label>With resettable and clearable, default value: Hello, Action Button Style: Standalone</label>
        <ae-text-input placeholder="Resettable and clearable input" resettable clearable value="Hello" default-value="Hello" action-button-style="standalone"></ae-text-input>
        <label>With start icon</label>
        <ae-text-input label="url" placeholder="example.com">
          <ae-icon name="url" slot="start"></ae-icon>
        </ae-text-input>
        <label>With end icon</label>
        <ae-text-input label="search" placeholder="Type to search...">
          <ae-icon name="search" slot="end"></ae-icon>
        </ae-text-input>
        <label>With start and end icons</label>
        <ae-text-input label="url" placeholder="example.com">
          <ae-icon name="url" slot="start"></ae-icon>
          <ae-icon name="search" slot="end"></ae-icon>
        </ae-text-input>

        <label>Number</label>
        <ae-text-input label="Number" placeholder="example.com" type="number">
        </ae-text-input>

        <label>Disabled</label>
          <ae-text-input label="URL" placeholder="example.com" type="number" disabled>
        </ae-text-input>

        <label>Readonly</label>
        <ae-text-input label="URL" placeholder="example.com"  readonly>
        </ae-text-input>

        <label>Password with visible toggle</label>
        <ae-text-input label="Password" placeholder="Enter password" type="password" visible-toggle value="secret"></ae-text-input>

        <label>Password without visible toggle</label>
        <ae-text-input label="Password" placeholder="Enter password" type="password" value="secret" ></ae-text-input>

         <label>Password with visible toggle and clearable </label>
        <ae-text-input label="Password" placeholder="Enter password" type="password" visible-toggle clearable value="secret"></ae-text-input>

        <label>Inline icon actions (default), clearable + resettable</label>
        <ae-text-input label="Inline actions" placeholder="Type..." clearable resettable default-value="Hello" value="Hello"></ae-text-input>

        <label>Custom clear/reset content (icon)</label>
        <ae-text-input label="Custom icons" clearable resettable default-value="Hello" value="Hello">
          <ae-icon name="close" slot="clear"></ae-icon>
          <ae-icon name="check" slot="reset"></ae-icon>
        </ae-text-input>

        <label>Custom clear/reset content (text)</label>
        <ae-text-input label="Custom text" clearable resettable default-value="Hello" value="Hello">
          <span slot="clear">Clear</span>
          <span slot="reset">Reset</span>
        </ae-text-input>      </div>
    </div>

    <!-- Checkbox -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

</body>
</html>
