<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){if(localStorage.getItem("aeico-demo-theme")==="dark")document.documentElement.setAttribute("theme","dark")})()</script>
  <title>ProgressBar — Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <div class="content">
    <div class="section">
      <h2>ProgressBar</h2>
      <span class="tag">&lt;ae-progress-bar&gt;</span>

      <div class="demo-group">
        <label>Basic — value &amp; label</label>
        <ae-progress-bar value="60" label="Upload Progress"></ae-progress-bar>
        <ae-progress-bar value="30" label="Download"></ae-progress-bar>
        <ae-progress-bar value="0" label="Not started"></ae-progress-bar>
        <ae-progress-bar value="100" label="Complete"></ae-progress-bar>
      </div>

      <div class="demo-group">
        <label>Colors</label>
        <ae-progress-bar value="70" color="primary" label="Primary"></ae-progress-bar>
        <ae-progress-bar value="70" color="secondary" label="Secondary"></ae-progress-bar>
        <ae-progress-bar value="70" color="success" label="Success"></ae-progress-bar>
        <ae-progress-bar value="70" color="danger" label="Danger"></ae-progress-bar>
        <ae-progress-bar value="70" color="warning" label="Warning"></ae-progress-bar>
        <ae-progress-bar value="70" color="info" label="Info"></ae-progress-bar>
      </div>

      <div class="demo-group">
        <label>Animated (shimmer effect)</label>
        <ae-progress-bar value="55" color="primary" label="Loading…" animated></ae-progress-bar>
        <ae-progress-bar value="80" color="success" label="Processing…" animated></ae-progress-bar>
        <ae-progress-bar value="40" color="warning" label="Pending…" animated></ae-progress-bar>
      </div>

      <div class="demo-group">
        <label>Custom thickness via <code>--progress-height</code></label>
        <ae-progress-bar value="60" color="primary" label="Thin (4px)" style="--progress-height: 4px"></ae-progress-bar>
        <ae-progress-bar value="60" color="success" label="Default (8px)"></ae-progress-bar>
        <ae-progress-bar value="60" color="danger" label="Thick (16px)" style="--progress-height: 16px"></ae-progress-bar>
        <ae-progress-bar value="60" color="info" label="Extra thick (24px)" style="--progress-height: 24px"></ae-progress-bar>
      </div>

      <div class="demo-group">
        <label>No label</label>
        <ae-progress-bar value="45" color="secondary"></ae-progress-bar>
        <ae-progress-bar value="45" color="secondary" animated></ae-progress-bar>
      </div>
    </div>

    <!-- Layout Utilities -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

</body>
</html>
