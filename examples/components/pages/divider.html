<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){if(localStorage.getItem("aeico-demo-theme")==="dark")document.documentElement.setAttribute("theme","dark")})()</script>
  <title>Divider - Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <div class="content">
    <div class="section">
      <h2>Divider</h2>
      <span class="tag">&lt;ae-divider&gt;</span>

      <div class="demo-group">
        <label>Default (horizontal, 1px)</label>
        <ae-divider></ae-divider>
      </div>

      <div class="demo-group">
        <label>Thickness 3px</label>
        <ae-divider thickness="3px"></ae-divider>
      </div>

      <div class="demo-group">
        <label>Thickness 6px</label>
        <ae-divider thickness="6px"></ae-divider>
      </div>

      <div class="demo-group">
        <label>Colors</label>
        <ae-divider></ae-divider>
        <ae-divider color="primary"></ae-divider>
        <ae-divider color="secondary"></ae-divider>
        <ae-divider color="success"></ae-divider>
        <ae-divider color="danger"></ae-divider>
        <ae-divider color="warning"></ae-divider>
        <ae-divider color="info"></ae-divider>
      </div>

      <div class="demo-group">
        <label>Vertical (inside flex container)</label>
        <div style="display: inline-flex; align-items: center; gap: 12px; height: 1.5em; line-height: 1.5;">
          <span>Left</span>
          <ae-divider vertical></ae-divider>
          <span>Middle</span>
          <ae-divider vertical thickness="2px" color="primary"></ae-divider>
          <span>Right</span>
        </div>
      </div>
    </div>

    <!-- Card -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

</body>
</html>
