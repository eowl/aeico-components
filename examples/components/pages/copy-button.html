<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){if(localStorage.getItem("aeico-demo-theme")==="dark")document.documentElement.setAttribute("theme","dark")})()</script>
  <title>Copy Button - Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <div class="content">
    <div class="section">
      <h2>Copy Button</h2>
      <span class="tag">&lt;ae-copy-button&gt;</span>

      <div class="demo-group">
        <label>text attribute (colors)</label>
        <div class="demo-row">
          <ae-copy-button text="Default text" title="Default"></ae-copy-button>
          <ae-copy-button text="Primary text" color="primary" title="Primary"></ae-copy-button>
          <ae-copy-button text="Secondary text" color="secondary" title="Secondary"></ae-copy-button>
          <ae-copy-button text="Success text" color="success" title="Success"></ae-copy-button>
          <ae-copy-button text="Danger text" color="danger" title="Danger"></ae-copy-button>
          <ae-copy-button text="Warning text" color="warning" title="Warning"></ae-copy-button>
          <ae-copy-button text="Info text" color="info" title="Info"></ae-copy-button>
          <ae-copy-button text="Light text" color="light" title="Light"></ae-copy-button>
          <ae-copy-button text="Dark text" color="dark" title="Dark"></ae-copy-button>
          <ae-copy-button text="Disabled" disabled title="Disabled"></ae-copy-button>
        </div>
      </div>

      <div class="demo-group">
        <label>outlined</label>
        <div class="demo-row">
          <ae-copy-button text="Default" variant="outlined" title="Default"></ae-copy-button>
          <ae-copy-button text="Primary" color="primary" variant="outlined" title="Primary"></ae-copy-button>
          <ae-copy-button text="Secondary" color="secondary" variant="outlined" title="Secondary"></ae-copy-button>
          <ae-copy-button text="Success" color="success" variant="outlined" title="Success"></ae-copy-button>
          <ae-copy-button text="Danger" color="danger" variant="outlined" title="Danger"></ae-copy-button>
          <ae-copy-button text="Warning" color="warning" variant="outlined" title="Warning"></ae-copy-button>
          <ae-copy-button text="Info" color="info" variant="outlined" title="Info"></ae-copy-button>
        </div>
      </div>

      <div class="demo-group">
        <label>faint</label>
        <div class="demo-row">
          <ae-copy-button text="Default" variant="faint" title="Default"></ae-copy-button>
          <ae-copy-button text="Primary" color="primary" variant="faint" title="Primary"></ae-copy-button>
          <ae-copy-button text="Success" color="success" variant="faint" title="Success"></ae-copy-button>
          <ae-copy-button text="Danger" color="danger" variant="faint" title="Danger"></ae-copy-button>
        </div>
      </div>

      <div class="demo-group">
        <label>subtle</label>
        <div class="demo-row">
          <ae-copy-button text="Default" variant="subtle" title="Default"></ae-copy-button>
          <ae-copy-button text="Primary" color="primary" variant="subtle" title="Primary"></ae-copy-button>
          <ae-copy-button text="Success" color="success" variant="subtle" title="Success"></ae-copy-button>
          <ae-copy-button text="Danger" color="danger" variant="subtle" title="Danger"></ae-copy-button>
        </div>
      </div>

      <div class="demo-group">
        <label>text variant</label>
        <div class="demo-row">
          <ae-copy-button text="Default" variant="text" title="Default"></ae-copy-button>
          <ae-copy-button text="Primary" color="primary" variant="text" title="Primary"></ae-copy-button>
          <ae-copy-button text="Success" color="success" variant="text" title="Success"></ae-copy-button>
          <ae-copy-button text="Danger" color="danger" variant="text" title="Danger"></ae-copy-button>
        </div>
      </div>

      <div class="demo-group">
        <label>sizes</label>
        <div class="demo-row" style="align-items: center;">
          <ae-copy-button text="3xs" color="primary" size="3xs" title="3xs"></ae-copy-button>
          <ae-copy-button text="2xs" color="primary" size="2xs" title="2xs"></ae-copy-button>
          <ae-copy-button text="xs" color="primary" size="xs" title="xs"></ae-copy-button>
          <ae-copy-button text="sm" color="primary" size="sm" title="sm"></ae-copy-button>
          <ae-copy-button text="md" color="primary" size="md" title="md (default)"></ae-copy-button>
          <ae-copy-button text="lg" color="primary" size="lg" title="lg"></ae-copy-button>
        </div>
      </div>

      <div class="demo-group">
        <label>slot fallback (no text attribute)</label>
        <div class="demo-row">
          <ae-copy-button color="primary" title="Copies slot text content">Slot content to copy</ae-copy-button>
          <ae-copy-button variant="outlined" color="secondary">Another value</ae-copy-button>
        </div>
      </div>

      <div class="demo-group">
        <label>custom duration (500ms)</label>
        <div class="demo-row">
          <ae-copy-button text="Quick feedback" color="success" duration="500" title="Reverts in 500ms"></ae-copy-button>
        </div>
      </div>

      <div class="demo-group">
        <label>copying ae-card content</label>
        <div class="demo-row" style="flex-wrap: wrap; gap: 16px; align-items: flex-start;">

          <!-- API key card -->
          <ae-card variant="outlined" style="width: 320px;">
            <div slot="header" style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:8px;">
              <span>API Key</span>
              <ae-copy-button
                text="sk-aeico-0x4f8b2c1d9e3a7f60"
                size="sm"
                variant="text"
                tooltip="Copy API key"
                tooltip-copied="Copied!"
              ></ae-copy-button>
            </div>
            <code style="font-family:monospace; font-size:0.85em; word-break:break-all;">sk-aeico-0x4f8b2c1d9e3a7f60</code>
          </ae-card>

          <!-- Install command card -->
          <ae-card variant="subtle" color="secondary" style="width: 280px;">
            <div slot="header" style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:8px;">
              <span>Install</span>
              <ae-copy-button
                text="npm install aeico-components"
                size="sm"
                variant="text"
                color="secondary"
                tooltip="Copy command"
              ></ae-copy-button>
            </div>
            <code style="font-family:monospace; font-size:0.9em;">npm install aeico-components</code>
          </ae-card>

          <!-- Multi-line snippet card -->
          <ae-card variant="outlined" color="primary" style="width: 340px;">
            <div slot="header" style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:8px;">
              <span>Usage snippet</span>
              <ae-copy-button
                id="snippet-copy"
                size="sm"
                variant="text"
                color="primary"
                tooltip="Copy snippet"
              ></ae-copy-button>
            </div>
            <pre id="snippet-content" style="margin:0; font-size:0.8em; line-height:1.5;">import 'aeico-components';

const btn = document.querySelector('ae-copy-button');
btn.text = 'Hello, world!';</pre>
          </ae-card>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // Wire the snippet copy button to copy the <pre> content via text attribute
    customElements.whenDefined('ae-copy-button').then(() => {
      const pre = document.getElementById('snippet-content');
      const copyBtn = document.getElementById('snippet-copy');
      if (pre && copyBtn) {
        copyBtn.text = pre.textContent.trim();
      }
    });
  </script>
</body>
</html>
