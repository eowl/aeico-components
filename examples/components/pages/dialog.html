<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){if(localStorage.getItem("aeico-demo-theme")==="dark")document.documentElement.setAttribute("theme","dark")})()</script>
  <title>Dialog - Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <div class="content">
    <div class="section">
      <h2>Dialog</h2>
      <span class="tag">&lt;ae-dialog&gt;</span>
      <div class="demo-row">
        <ae-button color="primary" id="open-dialog-btn">Open Modal Dialog</ae-button>
        <ae-button id="open-dialog-nonmodal-btn">Open Non-modal Dialog</ae-button>
      </div>
      <ae-dialog id="demo-dialog" label="Demo Dialog" width="480px">
        <p>This is a modal dialog. Click the overlay or close button to dismiss.</p>
        <ae-button slot="footer" data-close data-align-left>Back</ae-button>
        <ae-button slot="footer" data-close>Cancel</ae-button>
        <ae-button slot="footer" color="primary">Confirm</ae-button>
      </ae-dialog>
      <ae-dialog id="demo-dialog-nonmodal" label="Non-modal Dialog" modal="false" width="360px">
        <p>This is a non-modal dialog. The page remains interactive.</p>
        <ae-button slot="footer" data-close>Close</ae-button>
      </ae-dialog>
    </div>

    <!-- Tabs -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

<script type="module">
document.getElementById('open-dialog-btn')?.addEventListener('click', () => document.querySelector('#demo-dialog')?.open())
document.getElementById('open-dialog-nonmodal-btn')?.addEventListener('click', () => document.querySelector('#demo-dialog-nonmodal')?.open())
</script>
</body>
</html>
