<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){if(localStorage.getItem("aeico-demo-theme")==="dark")document.documentElement.setAttribute("theme","dark")})()</script>
  <title>Spinner — Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <div class="content">
    <div class="section">
      <h2>Spinner</h2>
      <span class="tag">&lt;ae-spinner&gt;</span>

      <div class="demo-group">
        <label>border (default)</label>
        <div class="demo-row" style="align-items: center;">
          <ae-spinner></ae-spinner>
          <ae-spinner color="primary"></ae-spinner>
          <ae-spinner color="secondary"></ae-spinner>
          <ae-spinner color="success"></ae-spinner>
          <ae-spinner color="danger"></ae-spinner>
          <ae-spinner color="warning"></ae-spinner>
          <ae-spinner color="info"></ae-spinner>
        </div>
      </div>

      <div class="demo-group">
        <label>dots</label>
        <div class="demo-row" style="align-items: center;">
          <ae-spinner variant="dots"></ae-spinner>
          <ae-spinner variant="dots" color="primary"></ae-spinner>
          <ae-spinner variant="dots" color="secondary"></ae-spinner>
          <ae-spinner variant="dots" color="success"></ae-spinner>
          <ae-spinner variant="dots" color="danger"></ae-spinner>
          <ae-spinner variant="dots" color="warning"></ae-spinner>
          <ae-spinner variant="dots" color="info"></ae-spinner>
        </div>
      </div>

      <div class="demo-group">
        <label>sizes (border)</label>
        <div class="demo-row" style="align-items: center;">
          <ae-spinner size="xs" color="primary"></ae-spinner>
          <ae-spinner size="sm" color="primary"></ae-spinner>
          <ae-spinner size="md" color="primary"></ae-spinner>
          <ae-spinner size="lg" color="primary"></ae-spinner>
        </div>
      </div>

      <div class="demo-group">
        <label>sizes (dots)</label>
        <div class="demo-row" style="align-items: center;">
          <ae-spinner variant="dots" size="xs" color="primary"></ae-spinner>
          <ae-spinner variant="dots" size="sm" color="primary"></ae-spinner>
          <ae-spinner variant="dots" size="md" color="primary"></ae-spinner>
          <ae-spinner variant="dots" size="lg" color="primary"></ae-spinner>
        </div>
      </div>

      <div class="demo-group">
        <label>speed</label>
        <div class="demo-row" style="align-items: center;">
          <ae-spinner color="primary" speed="0.4s" label="Fast"></ae-spinner>
          <ae-spinner color="primary" label="Normal (default)"></ae-spinner>
          <ae-spinner color="primary" speed="1.5s" label="Slow"></ae-spinner>
          <ae-spinner variant="dots" color="secondary" speed="0.4s" label="Dots fast"></ae-spinner>
          <ae-spinner variant="dots" color="secondary" label="Dots normal"></ae-spinner>
          <ae-spinner variant="dots" color="secondary" speed="1.5s" label="Dots slow"></ae-spinner>
        </div>
      </div>

      <div class="demo-group">
        <label>inline usage</label>
        <div class="demo-row">
          <ae-button color="primary" disabled>
            <ae-spinner size="xs" label="Saving…"></ae-spinner>
            Saving…
          </ae-button>
          <ae-button variant="outlined" disabled>
            <ae-spinner variant="dots" size="xs" color="primary" label="Loading…"></ae-spinner>
            Loading
          </ae-button>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
