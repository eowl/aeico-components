<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){if(localStorage.getItem("aeico-demo-theme")==="dark")document.documentElement.setAttribute("theme","dark")})()</script>
  <title>Slider — Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <div class="content">
    <div class="section">
      <h2>Slider</h2>
      <span class="tag">&lt;ae-slider&gt;</span>
      <div class="demo-group">
        <label>Free mode default ( 00, step 1) with reset</label>
        <ae-slider value="40" resettable default-value="40"></ae-slider>

        <label>Free mode percentage (step 5) with reset + clear</label>
        <ae-slider value="60" min="0" max="100" step="5" percentage resettable clearable default-value="60"></ae-slider>

        <label>Free mode with editable number box</label>
        <ae-slider id="slider-editable" value="30" min="0" max="100" step="10" editable resettable></ae-slider>

        <label>Options mode numeric values (sorted automatically)</label>
        <ae-slider id="slider-opts-numeric" resettable></ae-slider>

        <label>Options mode labeled steps (non-numeric, preserves order)</label>
        <ae-slider id="slider-opts-labeled" resettable></ae-slider>

        <label>Options mode editable disabled (options override free input)</label>
        <ae-slider id="slider-opts-input" editable resettable></ae-slider>

        <label>Marks free mode (shows min/max endpoints)</label>
        <ae-slider value="40" min="0" max="100" step="10" marks resettable></ae-slider>

        <label>Marks options mode with labels</label>
        <ae-slider id="slider-marks-labeled" marks resettable></ae-slider>

        <label>Marks options mode, numeric values only (no label)</label>
        <ae-slider id="slider-marks-numeric" marks percentage resettable></ae-slider>

        <label>Marks custom array (purely visual, step=10 still snaps)</label>
        <ae-slider id="slider-marks-custom" value="40" min="0" max="100" step="10" resettable default-value="40"></ae-slider>

        <label>Marks custom array with labels</label>
        <ae-slider id="slider-marks-labeled-custom" value="50" min="0" max="100" step="25" resettable default-value="50"></ae-slider>

        <label>Color success</label>
        <ae-slider value="60" min="0" max="100" step="10" marks color="success" resettable default-value="60"></ae-slider>

        <label>Color danger</label>
        <ae-slider value="30" min="0" max="100" step="10" marks color="danger" resettable default-value="30"></ae-slider>

        <label>Color warning</label>
        <ae-slider value="70" min="0" max="100" step="10" marks color="warning" resettable default-value="70"></ae-slider>

        <label>Tracked default color</label>
        <ae-slider value="40" min="0" max="100" step="1" tracked resettable default-value="40"></ae-slider>

        <label>Tracked success color</label>
        <ae-slider value="60" min="0" max="100" step="1" tracked color="success" marks resettable default-value="60"></ae-slider>

        <label>Tracked danger color</label>
        <ae-slider value="30" min="0" max="100" step="1" tracked color="danger" marks resettable default-value="30"></ae-slider>
      </div>
    </div>

    <!-- Select -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

<script type="module">
const sliderOptsNumeric = document.querySelector('#slider-opts-numeric')
if (sliderOptsNumeric) { sliderOptsNumeric.options = [0,25,50,75,100]; sliderOptsNumeric.value = '50' }

const sliderOptsLabeled = document.querySelector('#slider-opts-labeled')
if (sliderOptsLabeled) {
  sliderOptsLabeled.options = [{label:'XS',value:'xs'},{label:'SM',value:'sm'},{label:'MD',value:'md'},{label:'LG',value:'lg'},{label:'XL',value:'xl'}]
  sliderOptsLabeled.value = 'md'
}

const sliderOptsInput = document.querySelector('#slider-opts-input')
if (sliderOptsInput) { sliderOptsInput.options = [10,20,30,40,50]; sliderOptsInput.value = '20' }

const sliderMarksLabeled = document.querySelector('#slider-marks-labeled')
if (sliderMarksLabeled) {
  sliderMarksLabeled.options = [{label:'XS',value:'xs'},{label:'SM',value:'sm'},{label:'MD',value:'md'},{label:'LG',value:'lg'},{label:'XL',value:'xl'}]
  sliderMarksLabeled.value = 'md'
}

const sliderMarksNumeric = document.querySelector('#slider-marks-numeric')
if (sliderMarksNumeric) { sliderMarksNumeric.options = [0,25,50,75,100]; sliderMarksNumeric.value = '50' }

const sliderMarksCustom = document.querySelector('#slider-marks-custom')
if (sliderMarksCustom) { sliderMarksCustom.marks = [0,20,40,60,80,100] }

const sliderMarksLabeledCustom = document.querySelector('#slider-marks-labeled-custom')
if (sliderMarksLabeledCustom) {
  sliderMarksLabeledCustom.marks = [{value:0,label:'Min'},{value:25,label:'¼'},{value:50,label:'Mid'},{value:75,label:'¾'},{value:100,label:'Max'}]
}
</script>
</body>
</html>
