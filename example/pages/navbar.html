<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){if(localStorage.getItem("aeico-demo-theme")==="dark")document.documentElement.setAttribute("theme","dark")})()</script>
  <title>Navbar — Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <div class="content">
    <div class="section">
      <h2>Navbar</h2>
      <span class="tag">&lt;ae-navbar&gt;</span>

      <div class="demo-group">
        <label>appearance="block" hover fills full navbar height</label>
        <div style="border:1px solid var(--border-color);border-radius:3px;overflow:hidden;position:relative;">
          <ae-navbar appearance="block">
            <a slot="brand" href="#">MyApp</a>
            <a slot="start" href="#" aria-current="page">Home</a>
            <a slot="start" href="#">Docs</a>
            <a slot="start" href="#">Blog</a>
            <ae-button slot="end" size="sm">Sign in</ae-button>
          </ae-navbar>
        </div>
      </div>

      <div class="demo-group">
        <label>color="primary"</label>
        <div style="border-radius:3px;overflow:hidden;position:relative;">
          <ae-navbar color="primary" appearance="block">
            <a slot="brand" href="#">MyApp</a>
            <a slot="start" href="#" aria-current="page">Home</a>
            <a slot="start" href="#">Docs</a>
            <a slot="start" href="#">Blog</a>
            <ae-button slot="end" size="sm" variant="text" color="light">Sign in</ae-button>
          </ae-navbar>
        </div>
      </div>

      <div class="demo-group">
        <label>color="dark"</label>
        <div style="border-radius:3px;overflow:hidden;position:relative;">
          <ae-navbar color="dark" appearance="block">
            <a slot="brand" href="#">MyApp</a>
            <a slot="start" href="#" aria-current="page">Home</a>
            <a slot="start" href="#">Docs</a>
            <a slot="start" href="#">Changelog</a>
            <ae-button slot="end" size="sm" color="primary">Get started</ae-button>
          </ae-navbar>
        </div>
      </div>

      <div class="demo-group">
        <label>Custom height via --ae-navbar-height (4.5rem) + transparent bg</label>
        <div style="background:linear-gradient(135deg,#667eea,#764ba2);border-radius:3px;overflow:hidden;position:relative;">
          <ae-navbar style="--ae-navbar-height:4.5rem;--ae-navbar-bg:transparent;--ae-navbar-border-width:0;--ae-navbar-color:white;--ae-navbar-link-hover-bg:rgba(255,255,255,0.15);--ae-navbar-link-hover-color:white;--ae-navbar-link-active-color:white;--ae-navbar-link-padding-x:1rem;">
            <a slot="brand" href="#">Purple</a>
            <a slot="start" href="#" aria-current="page">Home</a>
            <a slot="start" href="#">Features</a>
            <a slot="start" href="#">Pricing</a>
            <ae-button slot="end" size="sm" color="light">Get started</ae-button>
          </ae-navbar>
        </div>
      </div>

      <div class="demo-group">
        <label>Compact height (2.5rem) via --ae-navbar-height</label>
        <div style="border:1px solid var(--border-color);border-radius:3px;overflow:hidden;position:relative;">
          <ae-navbar style="--ae-navbar-height:2.5rem;--ae-navbar-padding-x:1rem;--ae-navbar-link-padding-x:0.6rem;">
            <a slot="brand" href="#">Compact</a>
            <a slot="start" href="#" aria-current="page">Home</a>
            <a slot="start" href="#">Docs</a>
            <ae-button slot="end" size="xs" color="primary">Sign in</ae-button>
          </ae-navbar>
        </div>
      </div>

      <div class="demo-group">
        <label>end-only brand + right actions, no start links</label>
        <div style="border:1px solid var(--border-color);border-radius:3px;overflow:hidden;position:relative;">
          <ae-navbar>
            <ae-button slot="end" size="sm" variant="text">Login</ae-button>
            <ae-button slot="end" size="sm" color="primary">Sign up</ae-button>
          </ae-navbar>
        </div>
      </div>
    </div>

    <!-- Detail -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

</body>
</html>
