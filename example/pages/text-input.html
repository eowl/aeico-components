<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextInput — Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <ae-navbar color="dark" appearance="block" sticky>
    <a slot="brand" href="/">← All Components</a>
    <ae-button slot="end" id="theme-toggle" size="sm" color="light" variant="text">🌙 Dark</ae-button>
    <ae-button-group slot="end" compact>
      <ae-button id="lang-en" size="sm" color="primary">EN</ae-button>
      <ae-button id="lang-zh" size="sm">中文</ae-button>
    </ae-button-group>
  </ae-navbar>
  <div class="content">
    <div class="section">
      <h2>TextInput</h2>
      <span class="tag">&lt;ae-text-input&gt;</span>
      <div class="demo-group">
        <label>With resettable, default value: Hello</label>
        <ae-text-input placeholder="Type something..." resettable value="Hello" default-value="Hello"></ae-text-input>
        <label>With clearable</label>
        <ae-text-input placeholder="Clearable input" clearable value="Hello"></ae-text-input>
        <label>With resettable and clearable, default value: Hello</label>
        <ae-text-input placeholder="Resettable and clearable input" resettable clearable value="Hello" default-value="Hello"></ae-text-input>
        <ae-text-input placeholder="Resettable and clearable input" resettable clearable value="Hello" default-value="Hello" size="2xs"></ae-text-input>
      </div>
    </div>

    <!-- Checkbox -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

</body>
</html>
