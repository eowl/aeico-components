<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){if(localStorage.getItem("aeico-demo-theme")==="dark")document.documentElement.setAttribute("theme","dark")})()</script>
  <title>TextInput — Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <div class="content">
    <div class="section">
      <h2>TextInput</h2>
      <span class="tag">&lt;ae-text-input&gt;</span>
      <div class="demo-group">
        <label>With resettable, default value: Hello</label>
        <ae-text-input placeholder="Type something..." resettable value="Hello" default-value="Hello"></ae-text-input>
        <label>With clearable</label>
        <ae-text-input placeholder="Clearable input" clearable value="Hello"></ae-text-input>
        <label>With resettable and clearable, default value: Hello, Action Button Style: Integrated(default)</label>
        <ae-text-input placeholder="Resettable and clearable input" resettable clearable value="Hello" default-value="Hello"></ae-text-input>
        <label>With resettable and clearable, default value: Hello, Action Button Style: Standalone</label>
        <ae-text-input placeholder="Resettable and clearable input" resettable clearable value="Hello" default-value="Hello" action-button-style="standalone"></ae-text-input>
      </div>
    </div>

    <!-- Checkbox -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

</body>
</html>
