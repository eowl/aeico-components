<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch — Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <ae-navbar color="dark" appearance="block" sticky>
    <a slot="brand" href="/">← All Components</a>
    <ae-button slot="end" id="theme-toggle" size="sm" color="light" variant="text">🌙 Dark</ae-button>
    <ae-button-group slot="end" compact>
      <ae-button id="lang-en" size="sm" color="primary">EN</ae-button>
      <ae-button id="lang-zh" size="sm">中文</ae-button>
    </ae-button-group>
  </ae-navbar>
  <div class="content">
    <div class="section">
      <h2>Switch</h2>
      <span class="tag">&lt;ae-switch&gt;</span>
      <div class="demo-group">
        <div class="demo-row">
          <ae-switch></ae-switch>
          <ae-switch checked></ae-switch>
          <ae-switch resettable default-checked></ae-switch>
          <ae-switch checked resettable clearable default-checked></ae-switch>
          <ae-switch disabled></ae-switch>
          <ae-switch checked disabled></ae-switch>
        </div>
        <label>Sizes</label>
        <div class="demo-row">
          <ae-switch size="sm" checked></ae-switch>
          <ae-switch checked></ae-switch>
          <ae-switch size="lg" checked></ae-switch>
        </div>
        <label>Colors</label>
        <div class="demo-row">
          <ae-switch color="primary" checked></ae-switch>
          <ae-switch color="secondary" checked></ae-switch>
          <ae-switch color="success" checked></ae-switch>
          <ae-switch color="danger" checked></ae-switch>
          <ae-switch color="warning" checked></ae-switch>
        </div>
      </div>
    </div>

    <!-- Slider -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

</body>
</html>
