<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breadcrumb — Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <ae-navbar color="dark" appearance="block" sticky>
    <a slot="brand" href="/">← All Components</a>
    <ae-button slot="end" id="theme-toggle" size="sm" color="light" variant="text">🌙 Dark</ae-button>
    <ae-button-group slot="end" compact>
      <ae-button id="lang-en" size="sm" color="primary">EN</ae-button>
      <ae-button id="lang-zh" size="sm">中文</ae-button>
    </ae-button-group>
  </ae-navbar>
  <div class="content">
    <div class="section">
      <h2>Breadcrumb</h2>
      <span class="tag">&lt;ae-breadcrumb&gt;</span>

      <div class="demo-group">
        <label>Default separator "/"</label>
        <ae-breadcrumb>
          <ae-breadcrumb-item href="/">Home</ae-breadcrumb-item>
          <ae-breadcrumb-item href="/docs">Docs</ae-breadcrumb-item>
          <ae-breadcrumb-item>Getting Started</ae-breadcrumb-item>
        </ae-breadcrumb>
      </div>

      <div class="demo-group">
        <label>Custom text separator "/"</label>
        <ae-breadcrumb separator="/">
          <ae-breadcrumb-item href="/">Home</ae-breadcrumb-item>
          <ae-breadcrumb-item href="/products">Products</ae-breadcrumb-item>
          <ae-breadcrumb-item>Detail</ae-breadcrumb-item>
        </ae-breadcrumb>
      </div>

      <div class="demo-group">
        <label>Icon separator (slot="separator")</label>
        <ae-breadcrumb>
          <ae-icon slot="separator" name="chevron-right"></ae-icon>
          <ae-breadcrumb-item href="/">Home</ae-breadcrumb-item>
          <ae-breadcrumb-item href="/docs">Docs</ae-breadcrumb-item>
          <ae-breadcrumb-item>Current Page</ae-breadcrumb-item>
        </ae-breadcrumb>
      </div>

      <div class="demo-group">
        <label>With color (links follow color, separator stays muted)</label>
        <div class="demo-row">
          <ae-breadcrumb color="primary">
            <ae-breadcrumb-item href="/">Home</ae-breadcrumb-item>
            <ae-breadcrumb-item href="/docs">Docs</ae-breadcrumb-item>
            <ae-breadcrumb-item>Page</ae-breadcrumb-item>
          </ae-breadcrumb>
          <ae-breadcrumb color="success">
            <ae-breadcrumb-item href="/">Home</ae-breadcrumb-item>
            <ae-breadcrumb-item>Page</ae-breadcrumb-item>
          </ae-breadcrumb>
          <ae-breadcrumb color="danger">
            <ae-breadcrumb-item href="/">Home</ae-breadcrumb-item>
            <ae-breadcrumb-item>Page</ae-breadcrumb-item>
          </ae-breadcrumb>
        </div>
      </div>

      <div class="demo-group">
        <label>Single item (no separator)</label>
        <ae-breadcrumb>
          <ae-breadcrumb-item>Home</ae-breadcrumb-item>
        </ae-breadcrumb>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>

    <!-- Navbar -->
  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

</body>
</html>
