<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Label — Aeico Components</title>
  <link rel="stylesheet" href="../demo.css">
  <script type="module" src="../shared.ts"></script>
</head>
<body>
  <ae-navbar color="dark" appearance="block" sticky>
    <a slot="brand" href="/">← All Components</a>
    <ae-button slot="end" id="theme-toggle" size="sm" color="light" variant="text">🌙 Dark</ae-button>
    <ae-button-group slot="end" compact>
      <ae-button id="lang-en" size="sm" color="primary">EN</ae-button>
      <ae-button id="lang-zh" size="sm">中文</ae-button>
    </ae-button-group>
  </ae-navbar>
  <div class="content">
    <div class="section">
      <h2>Field Label</h2>
      <span class="tag">label / label-placement / required / helper-text / error</span>

      <label>TextInput — top layout (default)</label>
      <ae-text-input label="Username" placeholder="Enter username" style="max-width:320px"></ae-text-input>

      <label>TextInput — required + helper-text</label>
      <ae-text-input label="Email" required placeholder="you@example.com" helper-text="We'll never share your email." style="max-width:320px"></ae-text-input>

      <label>TextInput — error state</label>
      <ae-text-input label="Password" required placeholder="Min 8 characters" error="Password is too short." style="max-width:320px"></ae-text-input>

      <label>TextInput — left layout</label>
      <ae-text-input label="Full name" label-placement="left" placeholder="John Doe" style="max-width:480px"></ae-text-input>

      <label>TextInput — left layout + required + helper</label>
      <ae-text-input label="API Key" label-placement="left" required placeholder="sk-..." helper-text="Find this in your dashboard." style="max-width:480px"></ae-text-input>

      <label>TextInput — left layout + error</label>
      <ae-text-input label="Phone" label-placement="left" required placeholder="+1 555 000 0000" error="Invalid phone number." style="max-width:480px"></ae-text-input>

      <label>Select — top layout + required + error</label>
      <ae-select id="label-demo-select" label="Fruit" required placeholder="Choose a fruit" error="Please select an option." style="max-width:320px"></ae-select>

      <label>Select — left layout + helper-text</label>
      <ae-select id="label-demo-select-left" label="Color" label-placement="left" placeholder="Choose a color" helper-text="Used for the chart." style="max-width:480px"></ae-select>

      <label>Checkbox — top layout + required + error</label>
      <ae-checkbox label="Accept terms" required error="You must accept the terms." style="max-width:320px"></ae-checkbox>

      <label>Checkbox — left layout + helper-text</label>
      <ae-checkbox label="Send notifications" label-placement="left" helper-text="We'll email you about activity." style="max-width:480px"></ae-checkbox>

      <label>Switch — top layout</label>
      <ae-switch label="Dark mode" style="max-width:320px"></ae-switch>

      <label>Switch — left layout + helper-text</label>
      <ae-switch label="Auto-save" label-placement="left" checked helper-text="Saves every 30 seconds." style="max-width:480px"></ae-switch>

      <label>Slider — top layout + helper-text</label>
      <ae-slider label="Volume" value="60" helper-text="0 = silent, 100 = max." style="max-width:320px"></ae-slider>

      <label>Slider — left layout + required</label>
      <ae-slider label="Threshold" label-placement="left" value="40" required style="max-width:480px"></ae-slider>

      <label>RadioGroup — top layout + required + error</label>
      <ae-radio-group id="label-demo-rg" label="Tier" required error="Please select a tier." style="max-width:320px"></ae-radio-group>

      <label>RadioGroup — left layout</label>
      <ae-radio-group id="label-demo-rg-left" label="Plan" label-placement="left" style="max-width:480px"></ae-radio-group>
    </div><!-- /Field Label -->

  </div>
  <footer id="log-footer">
    <div id="log-footer-header">
      Event Log
      <span class="clear-log" id="clear-log">[clear]</span>
    </div>
    <div id="event-log"></div>
  </footer>

<script type="module">
import { FRUIT_OPTIONS, COLOR_OPTIONS } from '../shared.ts'

const labelDemoSelect = document.querySelector('#label-demo-select')
if (labelDemoSelect) labelDemoSelect.options = FRUIT_OPTIONS

const labelDemoSelectLeft = document.querySelector('#label-demo-select-left')
if (labelDemoSelectLeft) labelDemoSelectLeft.options = COLOR_OPTIONS

const tierOptions = [
  { label: 'Free', value: 'free' },
  { label: 'Pro', value: 'pro' },
  { label: 'Enterprise', value: 'enterprise' },
]
const labelDemoRg = document.querySelector('#label-demo-rg')
if (labelDemoRg) labelDemoRg.options = tierOptions

const labelDemoRgLeft = document.querySelector('#label-demo-rg-left')
if (labelDemoRgLeft) {
  labelDemoRgLeft.options = tierOptions
  labelDemoRgLeft.mode = 'button-group'
}
</script>
</body>
</html>
